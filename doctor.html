<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HospiQ — Doctor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader"><div class="spinner"></div></div>

<!-- Global Doctor Sticky Top Navbar -->
<header class="top-navbar doctor-nav-theme">
  <div class="navbar-container">
    <div class="navbar-logo" onclick="showView('view-dashboard');updateDoctorNav('dashboard');loadDashboard()">
      <img src="images/app_logo.png" alt="HospiQ" onerror="this.style.display='none'">
      <span>HospiQ <small style="font-size:10px;vertical-align:middle;background:var(--indigo-light);color:var(--indigo);padding:2px 6px;border-radius:4px;margin-left:4px">Doctor</small></span>
    </div>
    <nav class="navbar-menu">
      <a class="nav-link active" id="dnav-dashboard" onclick="showView('view-dashboard');updateDoctorNav('dashboard');loadDashboard()">
        <i class="fas fa-th-large"></i> <span>Dashboard</span>
      </a>
      <a class="nav-link" id="dnav-appointments" onclick="showView('view-doctor-appointments');updateDoctorNav('appointments');loadDoctorAppointments()">
        <i class="fas fa-calendar-check"></i> <span>Schedule</span>
      </a>
      <a class="nav-link" id="dnav-hospital" onclick="showView('view-doctor-hospital');updateDoctorNav('hospital');loadDoctorHospital()">
        <i class="fas fa-hospital"></i> <span>Hospital</span>
      </a>
      <a class="nav-link" id="dnav-notifications" onclick="showView('view-doctor-notifications');updateDoctorNav('notifications');loadDoctorNotifications()">
        <i class="fas fa-bell"></i> <span>Alerts</span>
        <span class="notif-badge" id="nb-nav" style="display:none">0</span>
      </a>
      <a class="nav-link" id="dnav-profile" onclick="showView('view-doctor-profile');updateDoctorNav('profile');loadDoctorSelfProfile()">
        <i class="fas fa-user"></i> <span>Profile</span>
      </a>
    </nav>
    <div class="navbar-right">
      <button class="btn-icon notif-btn" onclick="showView('view-doctor-notifications');updateDoctorNav('notifications');loadDoctorNotifications()">
        <i class="fas fa-bell"></i>
        <span class="notif-badge" id="nb-notifications" style="display:none">0</span>
      </button>
      <div id="dash-avatar" class="navbar-avatar" onclick="showView('view-doctor-profile');updateDoctorNav('profile');loadDoctorSelfProfile()" style="cursor:pointer"></div>
    </div>
  </div>
</header>

<!-- VIEW: DASHBOARD -->
<section id="view-dashboard" class="view active">
  <div class="greeting-section">
    <div class="greeting-title" id="dash-greeting">Good morning 👋</div>
    <div class="greeting-sub">Schedule for today</div>
  </div>
  <div id="dashboard-content"></div>
</section>

<!-- VIEW: DOCTOR APPOINTMENTS -->
<section id="view-doctor-appointments" class="view">
  <div class="top-bar">
    <div class="top-bar-logo"><span>My Schedule</span></div>
    <button class="btn-icon" onclick="loadDoctorAppointments()"><i class="fas fa-refresh"></i></button>
  </div>
  <div class="filter-row">
    <button class="chip active" onclick="filterDoctorAppts('all', this)">All</button>
    <button class="chip" onclick="filterDoctorAppts('pending', this)">Pending</button>
    <button class="chip" onclick="filterDoctorAppts('accepted', this)">Accepted</button>
    <button class="chip" onclick="filterDoctorAppts('rescheduled', this)">Rescheduled</button>
    <button class="chip" onclick="filterDoctorAppts('completed', this)">Completed</button>
  </div>
  <div id="doctor-appt-list" style="padding:12px 16px"></div>
</section>

<!-- VIEW: DOCTOR HOSPITAL -->
<section id="view-doctor-hospital" class="view">
  <div class="top-bar">
    <button class="btn-icon" onclick="showView('view-dashboard');updateDoctorNav('dashboard')"><i class="fas fa-arrow-left"></i></button>
    <span style="font-weight:700;font-size:16px">My Hospital</span>
    <div style="width:36px"></div>
  </div>
  <div id="doctor-hospital-content"></div>
</section>

<!-- VIEW: DOCTOR NOTIFICATIONS -->
<section id="view-doctor-notifications" class="view">
  <div class="top-bar">
    <div class="top-bar-logo"><span>Notifications</span></div>
    <button class="btn-icon" onclick="loadDoctorNotifications()"><i class="fas fa-refresh"></i></button>
  </div>
  <div id="doctor-notif-list"></div>
</section>

<!-- VIEW: DOCTOR PROFILE -->
<section id="view-doctor-profile" class="view">
  <div id="doctor-profile-content"></div>
</section>

<!-- ── MODALS ── -->

<!-- Patient Detail Modal -->
<div id="patient-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('patient-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div id="patient-modal-content"></div>
  </div>
</div>

<!-- Reschedule Modal -->
<div id="reschedule-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('reschedule-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 class="modal-title">Reschedule Appointment</h3>
    <input type="hidden" id="reschedule-appt-id">
    <div class="form-group">
      <label class="form-label">New Date</label>
      <input type="date" id="reschedule-date" class="form-input" oninput="loadRescheduleSlots()" min="">
    </div>
    <div id="reschedule-slots"></div>
    <input type="hidden" id="reschedule-selected-time">
    <div class="form-group mt-12">
      <label class="form-label">Reason for Rescheduling</label>
      <textarea id="reschedule-reason" class="form-input" rows="3" placeholder="Please provide a reason..."></textarea>
    </div>
    <button class="btn-primary mt-12" onclick="confirmReschedule()">Confirm Reschedule</button>
  </div>
</div>

<!-- Slot Creator Modal -->
<div id="slot-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('slot-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 class="modal-title">Create Slots</h3>
    <div class="form-group">
      <label class="form-label">Apply to</label>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="chip active" id="slot-all-btn" onclick="slotToggleApply('all')">All Days</button>
        <button class="chip" id="slot-specific-btn" onclick="slotToggleApply('specific')">Specific Date</button>
      </div>
      <input type="date" id="slot-date" class="form-input" style="display:none" min="">
    </div>
    <p class="form-label">Select Time Slots</p>
    <div id="slot-checkboxes" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 16px"></div>
    <button class="btn-ghost text-teal" onclick="addCustomSlotTime()" style="margin-bottom:12px"><i class="fas fa-plus"></i> Add Custom Time</button>
    <div id="custom-slot-input" style="display:none;margin-bottom:16px">
      <div style="display:flex;gap:8px">
        <input type="time" id="custom-time-input" class="form-input" style="flex:1">
        <button class="btn-primary btn-sm" onclick="confirmCustomTime()">Add</button>
      </div>
    </div>
    <button class="btn-primary" onclick="saveSlots()">Save Slots</button>
  </div>
</div>

<!-- Doctor Edit Profile Modal -->
<div id="doc-edit-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('doc-edit-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 class="modal-title">Edit Profile</h3>
    <div style="display:flex;justify-content:center;margin-bottom:16px">
      <div style="position:relative;cursor:pointer" onclick="document.getElementById('dep-photo').click()">
        <div id="dep-avatar-preview"></div>
        <div style="position:absolute;bottom:0;right:0;background:var(--teal);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px"><i class="fas fa-camera"></i></div>
      </div>
    </div>
    <input type="file" id="dep-photo" style="display:none" accept="image/*" onchange="previewDepPhoto(this)">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="dep-name" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input type="text" id="dep-phone" class="form-input">
    </div>
    <button class="btn-primary mt-12" onclick="saveDocEditProfile()">Save Changes</button>
  </div>
</div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (!requireDoctor()) return;
  startNotifPolling();
  loadDashboard();
});
</script>
</body>
</html>
